# Avocado: read keys from /var as well as ~/.ssh.
#
# The root filesystem is read-only, so a home directory on it (root's is
# /root) cannot hold ~/.ssh/authorized_keys. /var/lib/ssh/authorized_keys.d/
# is writable and survives reboots and OS updates; put each user's keys in
# a file named for the user (e.g. .../authorized_keys.d/root), shipped with
# the runtime's var_files or written at provisioning. Per-user files keep one
# account's keys from opening another. StrictModes applies: the directory and
# files must be owned by root (or the user) and not group/world writable.
#
# sshd keeps the first value it sees and sshd_config Includes this directory
# first, so this takes precedence over sshd_config's own AuthorizedKeysFile.
AuthorizedKeysFile .ssh/authorized_keys /var/lib/ssh/authorized_keys.d/%u

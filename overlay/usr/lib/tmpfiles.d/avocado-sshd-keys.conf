# Keys shipped with the runtime's var_files keep the build host's owner and
# mode, and sshd's StrictModes refuses a key file or parent directory that is
# not owned by root (or the user) or that is group or world writable. Reset
# the directory to root:root 0755 and its files to root:root 0644 on every boot.
d /var/lib/ssh/authorized_keys.d 0755 root root -
Z /var/lib/ssh/authorized_keys.d ~0755 root root -
